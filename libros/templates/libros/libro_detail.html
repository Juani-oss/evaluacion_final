{% extends "base.html" %}

{% block title %}

{{ libro.title }}

{% endblock %}

{% block content %}

<div class="container my-5">
    <div class="row justify-content-center align-items-center">
        <div class="col-md-4 text-center mb-4">
            <img src="{{ libro.image }}" alt="{{ libro.title }}" class="img-fluid rounded shadow" style="max-height: 450px;"/>
        </div>
        <div class="col-md-5 text-start">
            <h1 class="mb-3">{{ libro.title }}</h1>
            <p class="text-muted">{{ libro.description }}</p>
            <h3 class="mb-4">$ {{ libro.price }}</h3>
            <a href="{% url 'libro_list' %}" class="btn btn-primary" role="button">Volver a la Lista</a>
        </div>
    </div>
</div>

{% endblock %}
