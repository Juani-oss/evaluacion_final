{% extends "base.html" %}

{% block content %}
<div class="container-fluid text-center">
    <h1>Libreria</h1>
    <a href="{% url 'libro_create' %}" class="btn btn-primary m-3" >Crear Libro</a>
    <div class="d-flex flex-wrap justify-content-center gap-5">
        {% for libro in libros %}
            <div class="card" style="width: 18rem;">
                <img
                    src="{{ libro.image }}"
                    class="card-img-top img-fluid p-3"
                    alt="{{ libro.title }}"
                    style="height: 200px; width: fit-content; margin: auto;">

                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">{{libro.title}}</h5>
                    <p class="card-text text-truncate">{{libro.description}}</p>
                    <h5 class="card-text">{{ libro.price}}</h5>
                    <a href="{% url 'libro_detail' libro.id %}" class="btn btn-primary" >Ver Detalles</a>
                    <a href="{% url 'libro_update' libro.id %}" class="btn btn-primary mb-3" >Editar</a>
                    <a href="{% url 'libro_delete' libro.id %}" class="btn btn-primary mb-3" >Eliminar</a>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
